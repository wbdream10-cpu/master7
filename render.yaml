services:
  - type: web
    name: ahbi-service-portal
    runtime: node
    region: singapore
    plan: free
    repo: https://github.com/wbdream10-cpu/master7
    branch: main
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build && npm test && npm run test:postgres
    startCommand: PUBLIC_ORIGIN="$RENDER_EXTERNAL_URL" node standalone/server.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: HOST
        value: "0.0.0.0"
      - key: PORTAL_POSTGRES_URL
        sync: false
